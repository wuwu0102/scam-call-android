name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper executable (if present)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Gradle build
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Lint
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew lint
          else
            gradle lint
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlertaNumeroMX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
